<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>特定商取引法に基づく表記 | love tips</title>
    <style>
      body {
        margin: 0;
        background: #fffdfb;
        color: #3f2f34;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        line-height: 1.8;
      }

      main {
        margin: 0 auto;
        max-width: 760px;
        padding: 40px 20px 64px;
      }

      h1 {
        font-size: clamp(1.6rem, 5vw, 2.2rem);
        line-height: 1.4;
      }

      dl {
        display: grid;
        gap: 20px;
        margin: 32px 0;
      }

      dt {
        font-weight: 700;
      }

      dd {
        margin: 6px 0 0;
        color: #7d4d5d;
      }

      a {
        color: #8f4657;
        font-weight: 700;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 32px;
      }

      .button {
        border-radius: 999px;
        background: #8f4657;
        color: white;
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p>love tips</p>
      <h1>特定商取引法に基づく表記</h1>
      <dl>
        <div>
          <dt>販売事業者</dt>

        </div>
        <div>

        </div>
        <div>
          <dt>引き渡し時期</dt>
          <dd>ご相談内容を確認後、通常24〜72時間以内を目安にお届けします。</dd>
        </div>
        <div>

            サービスの性質上、鑑定着手後のキャンセル・返金は原則としてお受けしていません。

        <div>

        </div>
      </dl>
      <div class="actions">
        <a class="button" href="https://lin.ee/sabWBtS" target="_blank" rel="noopener noreferrer">LINE友だち追加はこちら</a>
        <a href="./">トップページへ戻る</a>

</html>
